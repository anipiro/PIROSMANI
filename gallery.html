<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gallery — Masterpieces on Oilcloth | Niko Pirosmani</title>
  <meta name="description" content="A gallery of Niko Pirosmani's paintings on black oilcloth: feasts, portraits, and animals." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="nav-inner">
      <a href="index.html" class="brand">Niko<span>·</span>Pirosmani</a>
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
      <nav>
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="bio.html">Biography</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="style.html">Style</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="container fade-in">
      <h2 class="section-title">Masterpieces on Oilcloth</h2>
      <p class="section-sub">Painted on black oilcloth and tavern signboards. Click any work to view it larger, then use the arrow keys to move between paintings.</p>

      <div class="gallery-tools">
        <div class="filters" role="group" aria-label="Filter by subject">
          <button type="button" class="filter active" data-category="all" aria-pressed="true">All</button>
          <button type="button" class="filter" data-category="animals" aria-pressed="false">Animals</button>
          <button type="button" class="filter" data-category="portraits" aria-pressed="false">Portraits</button>
          <button type="button" class="filter" data-category="everyday" aria-pressed="false">Everyday life</button>
        </div>
        <div class="search-sort">
          <input type="search" id="search" placeholder="Search by title" aria-label="Search by title" />
          <select id="sort" aria-label="Sort paintings">
            <option value="default">Museum order</option>
            <option value="az">Title A–Z</option>
            <option value="za">Title Z–A</option>
          </select>
        </div>
      </div>
      <p id="count" class="count" aria-live="polite"></p>

      <div class="gallery-grid"></div>
    </section>
  </main>

  <div id="modal" class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" aria-label="Close">×</button>
    <button class="modal-prev" aria-label="Previous painting">‹</button>
    <button class="modal-next" aria-label="Next painting">›</button>
    <div>
      <img src="" alt="" />
      <p class="modal-caption"></p>
    </div>
  </div>

  <button id="toTop" aria-label="Back to top">↑</button>

  <footer class="site-footer">
    <p>© 2026 · Images: public domain · Wikimedia Commons</p>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
